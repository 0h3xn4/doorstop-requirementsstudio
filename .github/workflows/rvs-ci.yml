name: rvs-ci
on:
  push:
    paths: ["rvs/**", ".github/workflows/rvs-ci.yml"]
  pull_request:
    paths: ["rvs/**", ".github/workflows/rvs-ci.yml"]
defaults:
  run:
    working-directory: rvs
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      RVS_CONFIG_DIR: ${{ github.workspace }}/rvs-ci-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-xkb1 libxcb-util1
      - name: Runtime-only install must yield a runnable app
        run: |
          pip install -e .
          python -m rvs_cli --version
      - name: The GUI starts headless (offscreen) from the runtime-only install
        shell: bash
        run: |
          python -c "from rvs_gui.app import create_app, create_main_window; app = create_app([]); w = create_main_window(); w.show(); app.processEvents(); print(w.windowTitle())"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  package:
    needs: test
    # Ubuntu 24.04 on purpose: the bundle needs the glibc of the machine it is built on (2.38 or newer, docs/RELEASE.md)
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: >
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
          libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-xkb1 libxcb-util1
        working-directory: .
      - run: pip install ".[dev]"
        working-directory: rvs
      # clean build environment, licence report, SBOM, PyInstaller, manifest, selftest, offscreen start, archive
      - run: sh scripts/build_release.sh
        working-directory: rvs
      - uses: actions/upload-artifact@v4
        with:
          name: rvs-linux
          path: |
            rvs/dist/rvs-studio-*.tar.gz
            rvs/dist/rvs-studio-*.tar.gz.sha256
