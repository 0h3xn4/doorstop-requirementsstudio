# Quality rules (engine arrives in M2). Word and term lists below are seeds from the spec examples;
# the company lists are placeholders (TODO-COMPANY).
rvs_schema_version: 1
rules:
  - {id: shall-present, severity: error, enabled: true, description: "The statement uses 'shall'."}
  - {id: single-statement, severity: warning, enabled: true, description: "One requirement per statement."}
  - id: vague-words
    severity: warning
    enabled: true
    description: "The statement avoids vague words."
    params:
      words: ["adequate", "as appropriate", "user-friendly"]   # TODO-COMPANY
  - id: no-implementation
    severity: warning
    enabled: true
    description: "A functional requirement does not prescribe implementation."
    params:
      terms: []   # TODO-COMPANY
  - {id: verify-method-set, severity: warning, enabled: true, description: "A verification method is set."}
  - {id: has-parent, severity: error, enabled: true, description: "The item has a parent unless it is in the root document."}
  - {id: verified-when-approved, severity: error, enabled: true, description: "An approved item has at least one verification link."}
