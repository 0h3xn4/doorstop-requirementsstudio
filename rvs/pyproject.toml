[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvs"
version = "0.1.0"
description = "Requirements & Verification Studio - offline requirements management on Doorstop"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "doorstop==3.2",
    "PySide6-Essentials==6.12.0",
    "PyYAML==6.0.3",
    "fastjsonschema==2.22.2",
    "python-docx==1.2.0",
    "reportlab==5.0.1",
    "openpyxl==3.1.5",
    "Markdown==3.11",
]

# Release and dev tooling NEVER goes in [project].dependencies (spec rule 8).
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2",
    "pyinstaller>=6",
    "cyclonedx-bom>=4",
    "pip-licenses>=5",
    "pip-audit>=2",
    "build>=1",
    "types-PyYAML",
    "pypdf>=5",
    "fonttools>=4.50",
]

[project.scripts]
rvs = "rvs_cli.main:main"

[project.gui-scripts]
rvs-studio = "rvs_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rvs_gui = ["assets/fonts/*"]
rvs_core = ["config/defaults/*.yaml", "config/schemas/*.json", "exporters/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not perf\""
markers = ["perf: performance spikes, run with -m perf"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S603", "S404", "E501"]  # long user-facing message strings are fine; ruff format wraps code

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/rvs_core/adapter/__init__.py" = ["E402"]  # offline guard must run before Doorstop is imported

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["doorstop.*", "fastjsonschema"]
ignore_missing_imports = true
