name: rvs-ci
on:
  push:
    paths: ["rvs/**", ".github/workflows/rvs-ci.yml"]
  pull_request:
    paths: ["rvs/**", ".github/workflows/rvs-ci.yml"]
defaults:
  run:
    working-directory: rvs
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Runtime-only install must yield a runnable app
        run: |
          pip install -e .
          python -m rvs_cli --version
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
  package:
    needs: test
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
        working-directory: .
      - run: pip install ".[dev]"
        working-directory: rvs
      - run: pyinstaller packaging/rvs.spec --noconfirm
        working-directory: rvs
      - run: sh scripts/sbom.sh
        working-directory: rvs
      - uses: actions/upload-artifact@v4
        with:
          name: rvs-linux
          path: |
            rvs/dist/rvs-studio
            rvs/dist/rvs-sbom.cdx.json
            rvs/dist/rvs-licenses.*
